[package]
name = "strkd-desktop"
version = "0.1.0"
edition = "2021"
description = "strkd — Starknet wallet companion (desktop menu-bar app)"

[lib]
name = "strkd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
zeroize = "1"

# The wallet core + local JSON-RPC service live in the workspace at the repo
# root; the desktop app reuses them directly.
wallet-core = { path = "../../crates/wallet-core" }
wallet-rpc = { path = "../../crates/wallet-rpc" }
