[workspace]
resolver = "2"
members = ["crates/wallet-core", "crates/wallet-rpc", "crates/wallet-cli", "crates/prover"]
# The desktop (Tauri) app is its own crate under desktop/src-tauri; keep it out
# of this workspace so `cargo build` of the core stays lean and toolchain-free
# (mirrors ../dinner).
exclude = [".probe", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/starknet-innovation/strkd"

# krusty-kms is experimental and not published to crates.io. Pin to an exact
# commit; bumps must go through review (see spec/wallet-companion-spec.md §14).
# Pinned to the SNIP-12 hashing fix on krusty main (merge of PR #36): earlier
# revs hashed the "StarkNet Message" prefix with starknet_keccak and ASCII-encoded
# shortstring values instead of via parse_felt, so wallet_signTypedData signed a
# digest no SNIP-12 verifier / is_valid_signature accepts (strkd #7).
[workspace.dependencies]
krusty-kms = { git = "https://github.com/starknet-innovation/krusty-kms", rev = "b50afd674d25a9f9fe085118803baf483614450a" }
krusty-kms-common = { git = "https://github.com/starknet-innovation/krusty-kms", rev = "b50afd674d25a9f9fe085118803baf483614450a" }
# Must match krusty-kms's Felt type to avoid version-skew mismatches.
starknet-types-core = { version = "0.2.0", features = ["hash"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: re-serialising a contract-class ABI must reproduce the compiler's
# byte-exact JSON (key order included) or the derived class hash is wrong.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
# Vault crypto — mainstream, audited; independent of krusty internals.
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
sha3 = "0.10"
# wallet-rpc + prover (prover spawns the SNIP-36 CLI → needs "process")
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "process"] }
async-trait = "0.1"
axum = "0.7"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
# wallet-cli
clap = { version = "4", features = ["derive"] }
dirs = "5"
# prover (cfg(unix) only) — reap the SNIP-36 CLI's process group on timeout/failure
# so a leaked runner can't outlive the job and hold its port.
libc = "0.2"

# ---------------------------------------------------------------------------
# Distribution — cargo-dist / `dist` (https://opensource.axo.dev/cargo-dist/).
#
# This block is the policy: which installers, which targets. It drives
# `.github/workflows/release.yml`, which is GENERATED — change this block and
# re-run `dist generate` rather than editing the workflow. That file does carry
# ONE deliberate local modification (a narrowed tag glob, so `desktop-v*` tags
# don't trigger the CLI release); its top-of-file banner says how to re-apply it
# after a regenerate. Only `strkd` (crates/wallet-cli) is a binary, so it's the
# sole shipped artifact. A `v*` tag triggers the CLI release; the desktop app
# ships separately on `desktop-v*`.
#
# Note: `dist init` rewrites this block and DROPS these comments (it wrote its
# own one-liners). Re-add them after any future init.
#
# HOMEBREW IS OFF for now. Adding "homebrew" to `installers` builds a formula
# and `publish-jobs = ["homebrew"]` pushes it to a `tap`, but the intended tap
# repo `starknet-innovation/homebrew-tap` does not exist and this repo has no
# secrets configured, so every release would fail on the publish step. To turn
# it on: create that repo, add a PAT with write access to it as the
# `HOMEBREW_TAP_TOKEN` secret, then re-add to this block
#     installers = ["shell", "homebrew"]
#     tap = "starknet-innovation/homebrew-tap"
#     publish-jobs = ["homebrew"]
# and re-run `dist generate`. Until then the shell installer is the download
# path, alongside the plain per-target tarballs.
# ---------------------------------------------------------------------------
[workspace.metadata.dist]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax): Apple silicon
# + Intel macOS, x86_64 + arm64 Linux.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# CI backends to support
ci = "github"
# Whether to install an updater program
install-updater = false
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Path that installers should place binaries in (~/.cargo/bin)
install-path = "CARGO_HOME"
# `release.yml` is intentionally hand-modified (narrowed tag glob — see that
# file's banner). Without this, dist treats the file as out of date and refuses
# to build; with it, dist leaves the file alone instead of reverting the fix.
# So `dist generate` will NOT rewrite the CI: to adopt upstream CI changes,
# temporarily drop this key, regenerate, then re-apply the tag-glob edit.
allow-dirty = ["ci"]

# Optimized release builds for the shipped binary.
[profile.dist]
inherits = "release"
lto = "thin"
