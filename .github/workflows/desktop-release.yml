name: Desktop Release

# Builds the strkd DESKTOP app (Tauri) with the REAL on-device prover bundled,
# and attaches the installers to a draft GitHub Release — so users download
# instead of build. Ported from ../dinner's release workflow.
#
# This is SEPARATE from the CLI release: the `strkd` CLI (wallet-cli) ships via
# cargo-dist (see the root Cargo.toml [workspace.metadata.dist] block, which
# generates its own .github/workflows/release.yml on `dist init`). To keep the
# two from colliding, this desktop workflow triggers on a `desktop-v*` tag
# rather than `v*`.
#
# Scope (v0.1.0): the prover backend publishes prebuilt binaries only for
# darwin-arm64, linux-x86_64, linux-arm64 — so we ship macOS (Apple Silicon) and
# Linux x86_64. No Windows / Intel-mac build (no prebuilt prover there).
#
# Trigger: push a `desktop-v*` tag, or run manually (workflow_dispatch). The
# release is created as a DRAFT — a human reviews and publishes it.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0) — used for the draft release name'
        required: true
        default: desktop-v0.1.0

permissions:
  contents: write   # create the draft release + upload installers

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14       # Apple Silicon runner -> darwin-arm64
            target: darwin-arm64
          - os: ubuntu-24.04   # -> linux-x86_64; 24.04 matches the prebuilt prover's glibc (2.39) + has webkit2gtk 4.1
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120   # from-source RC.6 prover build (~30-40 min) + app bundle

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # The from-source prover build uses Python 3.12 (cairo-compile venv).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      # Build the verifier-compatible RC.6 prover (v1.1.3 / PROOF0) from source and
      # stage a relocatable bundle into desktop/src-tauri/resources/prover.
      # Heavy: ~30-40 min full sequencer build.
      - name: Build + stage prover from source
        working-directory: desktop
        env:
          SNIP36_SRC: ${{ runner.temp }}/snip36-src
        run: bash scripts/stage-prover-source.sh

      # Fail before a 20-min app build if the staged prover can't even launch on
      # this platform (catches arch/linker breakage in the bundled binaries).
      - name: Smoke-test staged prover
        working-directory: desktop
        run: |
          set -euo pipefail
          ./src-tauri/resources/prover/snip36 --help >/dev/null
          test -x ./src-tauri/resources/prover/deps/sequencer/target/release/starknet_transaction_prover
          echo "prover binaries launch on ${{ matrix.target }}"

      - name: Build app + attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build: do NOT set APPLE_* env here. tauri-action ad-hoc signs
          # the .app; users right-click → Open (or: xattr -dr com.apple.quarantine
          # /Applications/strkd.app). Setting APPLE_* to empty values makes the
          # macOS codesign step fail ("failed to import keychain certificate").
          # To ship signed + notarized later, add the APPLE_* signing secrets and
          # reintroduce them here per the tauri-action docs.
        with:
          projectPath: desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: strkd desktop ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true      # human-in-the-loop: review before publishing
          prerelease: false
