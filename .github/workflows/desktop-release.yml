name: Desktop Release

# Builds the strkd DESKTOP app (Tauri) with the REAL on-device prover bundled,
# and attaches the installers to a draft GitHub Release — so users download
# instead of build. Ported from ../dinner's release workflow.
#
# This is SEPARATE from the CLI release: the `strkd` CLI (wallet-cli) ships via
# cargo-dist out of `release.yml`, which triggers on a plain `v*` tag. This
# desktop workflow triggers on `desktop-v*`, so the two never collide (`v*` does
# not match `desktop-v0.1.0`, and vice versa).
#
# Platforms: the prover backend publishes prebuilt binaries for darwin-arm64,
# linux-x86_64 and linux-arm64 only — so we ship macOS (Apple Silicon) and Linux
# x86_64. No Windows or Intel-mac build (no prebuilt prover there). Adding
# linux-arm64 is a one-line matrix add.
#
# Trigger: push a `desktop-v*` tag, or run manually (workflow_dispatch, from
# `main` only). The release is created as a DRAFT — a human reviews and
# publishes it.
#
# Integrity: the release ships SHA256SUMS for every installer and a signed
# build-provenance attestation (`gh attestation verify <file> -R
# starknet-innovation/strkd`). The bundled prover is checked against hashes
# pinned in desktop/scripts/prover-pin.env. The apps are NOT code-signed or
# notarized, and the release notes say so.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. desktop-v0.2.0 (must match desktop-vX.Y.Z)'
        required: true

# Read-only by default; jobs that write raise their own permissions.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Refuse a malformed tag, and a manual run from anywhere but main: an
  # unreviewed branch must not be able to produce installers under a release tag.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check tag and ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' is not desktop-vX.Y.Z"; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::manual desktop releases run from main only (got $REF)"; exit 1
          fi

  build:
    needs: guard
    permissions:
      contents: write   # tauri-action creates the draft release + uploads installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14       # Apple Silicon runner -> darwin-arm64
            target: darwin-arm64
          - os: ubuntu-24.04   # -> linux-x86_64; 24.04 matches the prover's glibc (2.39) + has webkit2gtk 4.1
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    # Prebuilt prover staging (download + `snip36 setup --prebuilt` + doctor) plus
    # the Tauri release build. No 30-40 min from-source prover build any more.
    timeout-minutes: 60

    steps:
      # Third-party actions are pinned to commit SHAs: this workflow holds
      # `contents: write` and publishes the installers users run, so a moved tag
      # must not be able to change what ships. Bump deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # `snip36 setup --prebuilt` builds the Python cairo-compile venv before we
      # drop it (there is no --skip-venv flag), so Python is still required even
      # on the prebuilt path.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      # tauri builds with plain `cargo build`, which honours the committed
      # Cargo.lock but doesn't fail if it is stale. Fail here instead.
      - name: Check Cargo.lock is current
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Stage the pinned prover (version lives in desktop/scripts/prover-pin.env,
      # the single source of truth) from the backend's PREBUILT release artifacts.
      # v1.2.x prebuilt binaries are relocatable, so this is the supported CI path;
      # the script verifies SHA256SUMS, gates on `snip36 doctor`, then trims to the
      # lean shippable bundle. The from-source script is the slow fallback and
      # carries a stale RC.6/PROOF0 rationale — do not use it here.
      - name: Stage prebuilt prover
        working-directory: desktop
        run: bash scripts/stage-prover-prebuilt.sh

      # Fail before a 20-min app build if the staged prover can't launch on this
      # platform (catches arch/linker breakage in the bundled binaries).
      - name: Smoke-test staged prover
        working-directory: desktop
        run: |
          set -euo pipefail
          ./src-tauri/resources/prover/snip36 --help >/dev/null
          test -x ./src-tauri/resources/prover/deps/sequencer/target/release/starknet_transaction_prover
          test -x ./src-tauri/resources/prover/deps/bin/stwo-run-and-prove
          echo "prover binaries launch on ${{ matrix.target }}"

      - name: Build app + attach to draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build: do NOT set APPLE_* env here. tauri-action ad-hoc signs
          # the .app; users right-click → Open (or: xattr -dr com.apple.quarantine
          # /Applications/strkd.app). Setting APPLE_* to empty values makes the
          # macOS codesign step fail ("failed to import keychain certificate").
          # To ship signed + notarized later, add the APPLE_* signing secrets and
          # reintroduce them here per the tauri-action docs.
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: strkd desktop ${{ env.RELEASE_TAG }}
          releaseDraft: true      # human-in-the-loop: review before publishing
          prerelease: false
          releaseBody: |
            **These builds are not code-signed and not notarized.** macOS will say the app
            "cannot be opened": right-click → Open, or run
            `xattr -dr com.apple.quarantine /Applications/strkd.app`. Only do that after you
            have verified the download.

            **Verify before you install.**
            - Checksums: `shasum -a 256 -c SHA256SUMS --ignore-missing` (attached below).
            - Provenance: `gh attestation verify <file> -R starknet-innovation/strkd` proves
              the file was built by this repository's release workflow from this tag.

            Platforms: macOS (Apple Silicon) and Linux x86_64. The on-device SNIP-36 prover is
            bundled; its version is pinned in `desktop/scripts/prover-pin.env`.

  # Checksums and provenance for everything the build jobs attached. Runs once,
  # after every platform has uploaded, so SHA256SUMS covers the whole release.
  checksums:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # upload SHA256SUMS to the draft release
      id-token: write       # sign the provenance attestation
      attestations: write
    steps:
      - name: Download the release's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" -R "$REPO" -D assets
          rm -f assets/SHA256SUMS
          ls -la assets
          test -n "$(ls -A assets)" || { echo "::error::no assets on $RELEASE_TAG"; exit 1; }
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "assets/*"

      - name: Attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" SHA256SUMS -R "$REPO" --clobber
